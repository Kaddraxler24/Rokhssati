<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rokhssati · gestion (PRIVÉ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#F4F5F1;--surface:#FFFFFF;--ink:#15201A;--muted:#56605A;--line:#D9DDD6;--sign:#0E6A43;--soft:#E3EFE7;--amber:#F2B11B;--amber-soft:#FDF3DA;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#101612;--surface:#18201B;--ink:#E9EEEA;--muted:#A3ADA6;--line:#2C3730;--sign:#17784E;--soft:#1C3127;--amber:#E9AD22;--amber-soft:#33290F;--err:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow","Segoe UI",Arial,sans-serif}
.g-top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.g-top .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.g-top .brand{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.g-top .brand svg,.g-top .brand img{height:40px;width:auto}
.g-top .tag{margin-inline-start:auto;font:700 13px "Barlow Condensed",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--sign);background:var(--soft);padding:4px 10px;border-radius:999px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 clamp(28px,4vw,40px)/1.1 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;margin:6px 0 6px}
h2{font:700 22px/1.2 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:28px 0 8px}
.muted{color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input{width:min(320px,100%)}
button{font:600 15px "Barlow",Arial,sans-serif;cursor:pointer;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--sign)}
#go,#gm,#gs{background:var(--sign);border-color:var(--sign);color:#fff}
#nt{background:var(--amber-soft);border-color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font:700 34px/1.1 "Barlow Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px}.kpi small{display:block;color:var(--sign);margin-top:4px;font-size:13px}
.bar{display:inline-block;height:10px;background:var(--sign);border-radius:999px;vertical-align:middle;margin-inline-end:8px}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-top:14px}
table{border-collapse:separate;border-spacing:0;margin-top:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
td,th{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;font-variant-numeric:tabular-nums;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-weight:600}
.err{color:var(--err)}
#out{overflow-x:auto}
.rp{margin-top:8px;display:grid;gap:6px}
.rp textarea{width:100%;box-sizing:border-box;font:inherit}
.rp-done{margin-top:6px;color:#0E6B47}
.rp-no{margin-top:6px;color:#888;font-size:12px}
.done{background:#F2FAF5}
.rp textarea{background:var(--bg)}
</style></head>

<p class="muted">Collez la <b>clé admin</b> : c'est la valeur de la variable ROKH_ADMIN_KEY (Cloudflare Pages → Settings → Variables and Secrets). Sans la clé, cette page n'affiche rien.</p>
<div class="ctl"><input id="k" type="password" placeholder="Clé admin"> <button id="go">Codes activés</button> <button id="gm">Messages</button> <button id="gs">Statistiques</button> <select id="per"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="90">90 jours</option></select> <button id="nt"></button> <span id="msg"></span></div>
<div id="out"></div>
<script>
var BASE=location.protocol==='https:'&&/rokhssati\.com$/.test(location.hostname)?'':'https://rokhssati.com';
var k=document.getElementById('k'),msg=document.getElementById('msg'),out=document.getElementById('out');
try{k.value=localStorage.getItem('rk-admin')||''}catch(e){}
function rd(r){return r.text().then(function(t){try{return JSON.parse(t)}catch(e){return {ok:false,err:'HTTP '+r.status+' : '+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,160)}}})}
function d(s){return s?new Date(s).toLocaleString('fr-FR'):''}
document.getElementById('go').onclick=function(){
  msg.textContent='Chargement…';msg.className='';try{localStorage.setItem('rk-admin',k.value)}catch(e){}
  fetch(BASE+'/api/activations',{headers:{'x-admin-key':k.value},cache:'no-store'}).then(rd).then(function(j){
    if(!j.ok){msg.className='err';msg.textContent=j.err==='key'?'Clé admin incorrecte.':j.err==='config'?'La variable ROKH_ADMIN_KEY n’est pas encore dans Cloudflare (ou pas de redéploiement depuis).':'Erreur : '+j.err;out.innerHTML='';return}
    msg.textContent=j.n+' code(s) activé(s)'+(j.trials?' · '+j.trials+' essai(s) gratuit(s) sur 10':'');
    var h='<table><tr><th>Code</th><th>Appareil</th><th>1re activation</th><th>Dernière</th><th>Nb</th><th>Valable jusqu’au</th></tr>';
    j.rows.forEach(function(r){h+='<tr><td>'+r.code+'</td><td>'+r.dev+'</td><td>'+d(r.first)+'</td><td>'+d(r.last)+'</td><td>'+r.n+'</td><td>'+new Date(r.until).toLocaleDateString('fr-FR')+'</td></tr>'});
    out.innerHTML=h+'</table>';
  }).catch(function(){msg.className='err';msg.textContent='Pas de réponse (connexion, ou page ouverte hors navigateur). Ouvrez-la dans Chrome : rokhssati.com/gestion.html'});
};
function esc(x){return String(x||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var TPL=[
 {n:'Codes bientôt disponibles',fr:'Bonjour, merci pour votre message. Les codes d’activation seront bientôt disponibles : nous vous préviendrons ici. En attendant, tous les cours sont gratuits dans l’appli. L’équipe Rokhssati',ar:'مرحبًا، شكرًا على رسالتك. رموز التفعيل ستكون متوفرة قريبًا وسنعلمك هنا. في الأثناء، كل الدروس مجانية في التطبيق. فريق رخصتي',dz:'السلام، يعطيك الصحة على الميساج. أكواد التفعيل راهم جايين قريب ونقولولك هنا. في هاد الوقت، كامل الدروس بلاش في التطبيق. فريق رخصتي'},
 {n:'Merci pour le signalement',fr:'Merci pour votre signalement ! Nous avons vérifié la question et la corrigeons dans la prochaine mise à jour. L’équipe Rokhssati',ar:'شكرًا على تنبيهك! راجعنا السؤال وسنصححه في التحديث القادم. فريق رخصتي',dz:'يعطيك الصحة على التنبيه! شفنا السؤال وراح نصلحوه في التحديث الجاي. فريق رخصتي'},
 {n:'Question bien reçue, réponse',fr:'Bonjour, merci pour votre question. ',ar:'مرحبًا، شكرًا على سؤالك. ',dz:'السلام، يعطيك الصحة على السؤال. '},
 {n:'Auto-école : on vous recontacte',fr:'Bonjour, merci pour l’intérêt que vous portez à Rokhssati. Nous préparons l’offre auto-écoles et revenons vers vous très vite. L’équipe Rokhssati',ar:'مرحبًا، شكرًا على اهتمامك برخصتي. نحضّر عرض مدارس السياقة وسنعود إليك قريبًا جدًا. فريق رخصتي',dz:'السلام، يعطيك الصحة على الاهتمام برخصتي. راحنا نحضرو العرض تاع الأوطو إيكول ونرجعولك قريب. فريق رخصتي'}];
var KIND={code:'Code d’activation','auto-ecole':'Auto-école',autre:'Autre',signal:'Signalement de question'};
document.getElementById('gm').onclick=function(){
  msg.textContent='Chargement…';msg.className='';try{localStorage.setItem('rk-admin',k.value)}catch(e){}
  fetch(BASE+'/api/messages',{headers:{'x-admin-key':k.value},cache:'no-store'}).then(rd).then(function(j){
    if(!j.ok){msg.className='err';msg.textContent=j.err==='key'?'Clé admin incorrecte.':'Erreur : '+j.err;out.innerHTML='';return}
    msg.textContent=j.n+' message(s)';
    var h='<table><tr><th>Date</th><th>Sujet</th><th>Nom</th><th>Contact</th><th>Appareil</th><th>Message</th></tr>';
    j.rows.forEach(function(r){var extra=r.school?('<br><small>'+esc(r.school)+' · '+esc(r.wilaya)+' · '+esc(r.students)+' élèves/mois</small>'):'';
      var rep=(r.replies||[]).map(function(x){return '<div class="rp-done">↳ <b>Répondu le '+d(x.at)+'</b> : '+esc(x.text)+'</div>'}).join('');
      var form=r.canReply?('<div class="rp" data-key="'+esc(r.key)+'" data-lang="'+esc(r.lang)+'"><select class="rp-t"><option value="">Réponse toute prête…</option>'+TPL.map(function(t,i){return '<option value="'+i+'">'+esc(t.n)+'</option>'}).join('')+'</select><textarea class="rp-x" rows="3" placeholder="Votre réponse (elle s’affichera dans « Mes messages » sur l’appareil de la personne)"></textarea><button type="button" class="rp-go">Envoyer dans l’appli / le site</button> <span class="rp-m"></span></div>'):'<div class="rp-no">Réponse dans l’appli impossible (message envoyé avant le 7/11 ou depuis une ancienne version).</div>';
      h+='<tr'+((r.replies||[]).length?' class="done"':'')+'><td>'+d(r.at)+'</td><td>'+esc(KIND[r.kind]||r.kind)+((r.replies||[]).length?'<br><small>✓ répondu</small>':'')+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.phone)+(r.email?'<br>'+esc(r.email):'')+'</td><td>'+esc(r.dev)+'</td><td style="white-space:pre-wrap">'+esc(r.msg)+extra+rep+form+'</td></tr>'});
    out.innerHTML=h+'</table>';
    out.querySelectorAll('.rp').forEach(function(f){
      var L=/^fr/.test(f.dataset.lang)?'fr':/dz|ar-DZ/i.test(f.dataset.lang)?'dz':'ar';
      f.querySelector('.rp-t').onchange=function(){var t=TPL[this.value];if(t)f.querySelector('.rp-x').value=t[L]};
      f.querySelector('.rp-go').onclick=function(){var b=this,m=f.querySelector('.rp-m'),x=f.querySelector('.rp-x').value.trim();if(!x){m.textContent='Écrivez une réponse.';return}
        b.disabled=true;m.textContent='Envoi…';
        fetch(BASE+'/api/reply',{method:'POST',headers:{'x-admin-key':k.value,'Content-Type':'application/json'},body:JSON.stringify({key:f.dataset.key,text:x})}).then(rd).then(function(j){
          b.disabled=false;if(j.ok){m.textContent='✓ Envoyé. La personne le verra en ouvrant l’appli ou le site.';f.querySelector('.rp-x').value=''}else m.textContent='Erreur : '+j.err;
        }).catch(function(){b.disabled=false;m.textContent='Pas de réponse du serveur.'})};
    });
  }).catch(function(){msg.className='err';msg.textContent='Pas de réponse (connexion, ou page ouverte hors navigateur). Ouvrez-la dans Chrome : rokhssati.com/gestion.html'});
};
/* ---------- statistiques ---------- */
function n(x){return (x||0).toLocaleString('fr-FR')}
function sum(o,re){var t=0;for(var k in o)if(re.test(k))t+=o[k];return t}
var SRC={popup:'Fenêtre « Nouveauté »',page:'Section Android (accueil)',autre:'Autre lien'};
document.getElementById('gs').onclick=function(){
  msg.textContent='Chargement…';msg.className='';try{localStorage.setItem('rk-admin',k.value)}catch(e){}
  var days=document.getElementById('per').value;
  fetch(BASE+'/api/stats?days='+days,{headers:{'x-admin-key':k.value},cache:'no-store'}).then(rd).then(function(j){
    if(!j.ok){msg.className='err';msg.textContent=j.err==='key'?'Clé admin incorrecte.':'Erreur : '+j.err;out.innerHTML='';return}
    msg.textContent='Du '+new Date(j.from).toLocaleDateString('fr-FR')+' au '+new Date(j.to).toLocaleDateString('fr-FR');
    var E=j.events||{},W=j.web||{},rows={},tot={},today=j.to,d7=new Date(Date.parse(j.to)-6*864e5).toISOString().slice(0,10);
    Object.keys(E).forEach(function(d){rows[d]=rows[d]||{};for(var e in E[d]){rows[d][e]=E[d][e];tot[e]=(tot[e]||0)+E[d][e]}});
    (W.days||[]).forEach(function(x){rows[x.d]=rows[x.d]||{};rows[x.d].visits=x.visits;rows[x.d].views=x.views;tot.visits=(tot.visits||0)+x.visits;tot.views=(tot.views||0)+x.views});
    function per(re,from){var t=0;Object.keys(rows).forEach(function(d){if(d>=from)for(var e in rows[d])if(re.test(e))t+=rows[d][e]});return t}
    var K=[['Visites',/^visits$/],['Pages vues',/^views$/],['Téléchargements de l’appli (téléphones Android)',/^dl_/],['Messages envoyés',/^contact_(code|autoecole|autre)$/],['Tentatives de contact',/^contact_try$/],['Codes activés',/^act_ok$/],['Essais gratuits offerts (max 10)',/^essai_ok$/]];
    var h='<div class="kpis">'+K.map(function(x){return '<div class="kpi"><span>'+x[0]+'</span><b>'+n(per(x[1],'0'))+'</b><small>7 j : '+n(per(x[1],d7))+' · aujourd’hui : '+n(per(x[1],today))+'</small></div>'}).join('')+'</div>';
    if(!W.ok)h+='<div class="note"><b>Visites et pages vues non branchées.</b> '+(W.err==='not_configured'?'Elles sont mesurées par Cloudflare Web Analytics (dashboard Cloudflare → Analytics &amp; Logs → Web Analytics). Pour les voir ici, ajoutez CF_API_TOKEN, CF_ACCOUNT_ID et CF_SITE_TAG dans Cloudflare Pages → Settings → Variables and Secrets, puis redéployez.':'Erreur Cloudflare : '+esc(W.err))+'</div>';
    var ds=Object.keys(rows).sort().reverse();
    h+='<h2>Jour par jour</h2><table><tr><th>Jour</th><th>Visites</th><th>Pages vues</th><th>Téléch.</th><th>Contact (envoyés / tentatives)</th><th>Activations (ok / code faux / expiré)</th></tr>';
    ds.forEach(function(d){var r=rows[d];h+='<tr><td>'+new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})+'</td><td>'+(r.visits!=null?n(r.visits):'–')+'</td><td>'+(r.views!=null?n(r.views):'–')+'</td><td>'+n(sum(r,/^dl_/))+'</td><td>'+n(sum(r,/^contact_(code|autoecole|autre)$/))+' / '+n(r.contact_try)+'</td><td>'+n(r.act_ok)+' / '+n(r.act_faux)+' / '+n(r.act_expire)+'</td></tr>'});
    if(!ds.length)h+='<tr><td colspan="6" class="muted">Rien encore sur la période.</td></tr>';
    h+='</table>';
    function list(title,arr,lab,val){if(!arr||!arr.length)return '';var mx=Math.max.apply(null,arr.map(val))||1;return '<h2>'+title+'</h2><table>'+arr.map(function(x){return '<tr><td>'+esc(lab(x))+'</td><td style="width:55%"><span class="bar" style="width:'+Math.round(val(x)/mx*80)+'%"></span>'+n(val(x))+'</td></tr>'}).join('')+'</table>'}
    var srcs=Object.keys(tot).filter(function(e){return /^dl_/.test(e)}).map(function(e){return {s:e.slice(3),v:tot[e]}}).sort(function(a,b){return b.v-a.v});
    h+=list('Téléchargements par bouton',srcs,function(x){return SRC[x.s]||x.s},function(x){return x.v});
    var pcs=Object.keys(tot).filter(function(e){return /^dlpc_/.test(e)}).map(function(e){return {s:e.slice(5),v:tot[e]}}).sort(function(a,b){return b.v-a.v});
    if(pcs.length) h+=list('Téléchargements depuis un ordinateur (non installables, non comptés au-dessus)',pcs,function(x){return SRC[x.s]||x.s},function(x){return x.v});
    var VER={34:'1.4.17',35:'1.4.18',36:'1.4.19',37:'1.4.20',38:'1.4.21',39:'1.4.22',40:'1.4.23'};
    var apps=Object.keys(tot).filter(function(e){return /^app_v\d+$/.test(e)}).map(function(e){return {c:+e.slice(5),v:tot[e]}}).sort(function(a,b){return b.c-a.c});
    var vn=function(c){return c==='old'?'ancienne (≤ 1.4.22)':'v'+(VER[c]||('code '+c))};
    var ins=Object.keys(tot).filter(function(e){return /^inst_\d+$/.test(e)}).map(function(e){return {c:e.slice(5),v:tot[e]}});
    h+=list('Nouvelles installations (appli 1.4.23 et +)',ins,function(x){return vn(x.c)},function(x){return x.v});
    var mj=Object.keys(tot).filter(function(e){return /^maj_[a-z0-9]+_\d+$/.test(e)}).map(function(e){var p=e.split('_');return {f:p[1],t:p[2],v:tot[e]}});
    h+=list('Mises à jour : version d’avant → nouvelle',mj,function(x){return vn(x.f)+' → '+vn(x.t)},function(x){return x.v});
    h+=list('Ouvertures de l’appli par version (avec Internet)',apps,function(x){return 'v'+(VER[x.c]||('code '+x.c))},function(x){return x.v});
    var kinds=[['code','Question sur un code'],['autoecole','Auto-école'],['autre','Autre sujet'],['signal','Signalement de question'],['incomplet','Formulaire sans téléphone ni e-mail']].map(function(x){return {s:x[1],v:tot['contact_'+x[0]]||0}}).filter(function(x){return x.v});
    h+=list('Contact par sujet',kinds,function(x){return x.s},function(x){return x.v});
    if(W.ok){h+=list('Pages les plus vues',W.pages,function(x){return x.p},function(x){return x.views});
      h+=list('Pays des visiteurs',W.countries,function(x){return x.c},function(x){return x.visits});
      h+=list('D’où viennent les visiteurs',W.refs,function(x){return x.h},function(x){return x.visits});}
    out.innerHTML=h+'<p class="muted">Compteurs sans cookie ni donnée personnelle. Robots et aperçus de liens (WhatsApp, Facebook…) exclus. Jours à l’heure d’Algérie.</p>';
  }).catch(function(){msg.className='err';msg.textContent='Pas de réponse (connexion). Ouvrez la page dans Chrome : rokhssati.com/gestion.html'});
};
</script><script>(function(){var b=document.getElementById("nt");function r(){var on=false;try{on=localStorage.getItem("rokhssati-notrack")==="1"}catch(e){}b.textContent=on?"✅ Ce navigateur n'est pas compté (réactiver)":"Ne pas compter ce navigateur";}b.onclick=function(){try{if(localStorage.getItem("rokhssati-notrack")==="1")localStorage.removeItem("rokhssati-notrack");else localStorage.setItem("rokhssati-notrack","1")}catch(e){}r()};r();})();</script>
