<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rokhssati · رخصتي — Télécharger l'appli</title>
<style>
  :root { --bg:#F4F5F1; --ink:#15201A; --muted:#56605A; --sign:#0E6A43; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101612; --ink:#E9EEEA; --muted:#A3ADA6; --sign:#17784E; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 Tahoma, "Segoe UI", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:48px 20px; text-align:center; }
  .plate { display:inline-block; background:var(--sign); color:#fff; border-radius:16px; padding:6px; }
  .plate span { display:block; border:3px solid #fff; border-radius:11px; padding:4px 26px; font-size:44px; font-weight:700; }
  h1 { font-size:26px; margin:24px 0 8px; }
  p { color:var(--muted); margin:0 0 8px; }
  .btn { display:block; margin:28px 0 12px; padding:18px; border-radius:14px; background:var(--sign); color:#fff; font-size:22px; font-weight:700; text-decoration:none; }
  ol { text-align:start; color:var(--muted); padding-inline-start:22px; }
  .fr { direction:ltr; }
</style>
</head>
<body>
<main>
  <div class="plate"><span>رخصتي</span></div>
  <h1>حمّل تطبيق رخصتي</h1>
  <p class="fr">Télécharger l'appli Rokhssati</p>
  <a class="btn" href="https://rokhssati.com" download>تحميل · Télécharger (APK)</a>
  <ol>
    <li>افتح الملف بعد التحميل. · Ouvrez le fichier téléchargé.</li>
    <li>اسمح بالتثبيت عندما يطلب أندرويد ذلك. · Autorisez l'installation si Android le demande.</li>
  </ol>
  <p class="fr">Version 1.4.6 · Android 7.0+</p>
</main>
</body>
</html>
