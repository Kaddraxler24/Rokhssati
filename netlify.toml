# Rokhssati: static site, no build step. Netlify publishes this folder as is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Activation codes are checked here (keys in the Netlify environment variables, never in the repo).
[functions]
  directory = "netlify/functions"

# pages always re-checked so visitors get the latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
