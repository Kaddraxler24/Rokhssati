# Rokhssati: static site, no build step. Netlify publishes this folder as is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Activation codes are checked here (keys in the Netlify environment variables, never in the repo).
[functions]
  directory = "netlify/functions"

# Android app download (signed APK), served over HTTPS by the site itself
[[headers]]
  for = "/rokhssati.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"rokhssati.apk\""
    Cache-Control = "no-cache"
